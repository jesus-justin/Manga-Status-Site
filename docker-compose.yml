services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: manga_status
      DB_USER: manga_user
      DB_PASS: manga_pass
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: manga_status
      MYSQL_USER: manga_user
      MYSQL_PASSWORD: manga_pass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./manga.sql:/docker-entrypoint-initdb.d/manga.sql:ro

volumes:
  db_data:
